[project]
name = "fileuploader-s3"
version = "0.1.0"
description = "Bucket Storage File Uploader API - Flask + S3/MinIO/Cloudflare R2"
authors = [{ name = "Mark Wayne Menorca", email = "marcuwynu23@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.2",
    "flask-cors>=6.0.1",
    "python-dotenv>=1.1.1",
    "boto3>=1.40.34",
    "botocore>=1.40.34",
    "markdown>=3.9",
    "waitress>=3.0.2",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "prometheus-client>=0.25.0",
    "cryptography>=41.0.0",
    "flask-limiter>=3.5.0",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "python-magic>=0.4.27; sys_platform != 'win32'",
    "portalocker>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fileuploader_s3"]

[project.scripts]
app = "fileuploader_s3.main:main"
